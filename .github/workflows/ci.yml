name: Verify storefront

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: orders_test
          POSTGRES_USER: orders_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orders_test -d orders_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: node --test scripts/release/*.test.mjs
      - run: npx playwright install --with-deps chromium
      # Build demo purchase flows, then live-mode unavailable states, without merchant keys.
      - run: npm run test:e2e
      - name: Check out the reviewed order-service contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: joydas65/Ecommerce-Orders
          ref: 20561b58cc07ab55e0fe153759fd0c2a8d418127
          path: .orders-service
          persist-credentials: false
      - name: Start real order persistence for browser checks
        env:
          DATABASE_URL: postgres://orders_test:local-ci-only@127.0.0.1:5433/orders_test
          ORDERS_API_SECRET: local-orders-test-secret-at-least-32-characters
          PORT: '4100'
        run: |
          npm ci --ignore-scripts --prefix .orders-service
          npm run migrate --prefix .orders-service
          npm start --prefix .orders-service > /tmp/orders-service.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4100/health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify durable receipts and response-loss recovery
        run: npm run test:e2e:persistent
      - name: Verify Stripe browser contract without payment credentials
        run: npm run test:e2e:stripe-contract
      - name: Save browser reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: local-browser-reports
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
